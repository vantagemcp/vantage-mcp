[project]
name = "vantage-mcp"
version = "1.1.3"
description = "Vantage - MCP server exposing AI-answer-engine visibility/citation checks (ChatGPT, Perplexity, Gemini) as callable tools for AI agents and IDEs."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage_mcp"]
